version: "3.9"

services:
  api:
    container_name: api
    build:
      context: robert-watson-python-api-challenge
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=dev
    restart: always
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    command:
      ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  database:
    container_name: database
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_DB=api_database
      - POSTGRES_USER=api_user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_database"]
      interval: 1s
      timeout: 5s
      retries: 15
